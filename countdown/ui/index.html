<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown stat finder</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313c; --ink: #e6e8ec;
    --dim: #9aa3b2; --accent: #5b9dff; --good: #3ecf8e; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); margin: 0 0 10px; }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px;
  }
  header .hint { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 0; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .panel { padding: 18px; border-right: 1px solid var(--line); }
  .side { border-right: none; }
  .side section + section { margin-top: 26px; }
  label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  input, select, textarea, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; background: #262b34; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 16px; }
  .controls > div { display: flex; flex-direction: column; }
  .controls input[type=number] { width: 90px; }
  .check { flex-direction: row !important; align-items: center; gap: 6px; }
  .check input { width: auto; }
  #summary { color: var(--dim); margin-bottom: 12px; }
  .card {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; background: var(--panel);
  }
  .card .draft { font-size: 14px; }
  .card .meta { font-size: 11px; color: var(--dim); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .card .score { color: var(--accent); font-variant-numeric: tabular-nums; }
  .card.neg .score { color: var(--bad); }
  .rounded-tag { color: #d9a441; }
  .weights { font-size: 11px; color: var(--dim); margin-top: 4px; font-family: ui-monospace, Menlo, monospace; }
  .grid { display: grid; grid-template-columns: 1fr 70px; gap: 6px 10px; align-items: center; }
  .grid label { margin: 0; }
  .grid input { width: 100%; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  textarea { width: 100%; min-height: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; margin-top: 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .btnrow { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .dot.on { background: var(--good); }
  .mini { padding: 3px 7px; font-size: 12px; }
  #log { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11px;
         color: var(--dim); background: #0f1115; border: 1px solid var(--line); border-radius: 6px;
         padding: 8px; margin-top: 8px; max-height: 220px; overflow: auto; display: none; }
  .saved { color: var(--good); font-size: 12px; margin-left: 8px; }
  .err { color: var(--bad); font-size: 12px; }
  #countdownBanner {
    padding: 5px 18px; background: #202838; border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 12px; text-align: center;
  }
  #countdownBanner strong { color: var(--accent); font-weight: 600; }
  .tabs { display: flex; gap: 4px; padding: 8px 18px 0; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; padding: 7px 14px; color: var(--dim); font-weight: 500;
  }
  .tab:hover:not(:disabled) { border-color: transparent; color: var(--ink); }
  .tab.active { background: var(--panel); border-color: var(--line); color: var(--ink); }
  .view { display: none; }
  .view.active { display: grid; }
  #viewRange.active { grid-template-columns: 1fr; }
  .players {
    display: flex; flex-wrap: wrap; gap: 4px 12px; max-height: 140px; overflow: auto;
    border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel);
  }
  .players label { display: flex; align-items: center; gap: 5px; color: var(--ink); font-size: 12px; margin: 0; }
  .players input { width: auto; }
  .playersHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .playersHead button { font-size: 11px; padding: 3px 8px; }
  .numberBlock + .numberBlock { margin-top: 18px; }
  .numberBlock h3 {
    font-size: 13px; margin: 0 0 6px; color: var(--accent); display: flex; gap: 8px; align-items: baseline;
  }
  .numberBlock h3 .n-summary { color: var(--dim); font-size: 11px; font-weight: normal; }
</style>
</head>
<body>
<div id="countdownBanner" hidden></div>
<header>
  <h1>Countdown stat finder</h1>
  <span class="hint">local · edits <code>config.json</code> · previews against cached facts</span>
</header>

<div class="tabs">
  <button class="tab active" id="tabSingle" data-view="viewSingle">Single day</button>
  <button class="tab" id="tabRange" data-view="viewRange">Range</button>
</div>

<main class="view active" id="viewSingle">
  <div class="panel">
    <h2>Preview</h2>
    <div class="controls">
      <div><label>Number</label><input id="number" type="number" value="62" min="1"></div>
      <div><label>Scope</label>
        <select id="scope">
          <option value="all">all</option>
          <option value="roster">roster</option>
          <option value="team">team</option>
          <option value="player">player</option>
        </select>
      </div>
      <div id="playerWrap" hidden><label>Player</label><select id="player"></select></div>
      <div><label>Limit</label><input id="limit" type="number" min="1" placeholder="config"></div>
      <div class="check"><input id="all" type="checkbox"><label for="all" style="margin:0">show all</label></div>
      <div class="check"><input id="explain" type="checkbox"><label for="explain" style="margin:0">explain</label></div>
    </div>
    <div id="summary">—</div>
    <div id="results"></div>
  </div>

  <div class="panel side">
    <section>
      <h2>Config <span id="savedMsg"></span></h2>
      <div class="row" style="margin-bottom:12px">
        <div style="display:flex;flex-direction:column">
          <label for="firstDayGame">First day game</label>
          <input id="firstDayGame" type="date">
        </div>
      </div>
      <div id="fields" class="grid"></div>
      <details id="rawWrap">
        <summary>raw config.json (everything)</summary>
        <textarea id="raw" spellcheck="false"></textarea>
      </details>
      <div class="btnrow">
        <button id="save">Save to disk</button>
        <button id="reload" class="mini">Reload from disk</button>
      </div>
      <div id="cfgErr" class="err"></div>
    </section>

    <section>
      <h2>Roster</h2>
      <div class="controls">
        <div><label>Season</label><input id="rSeason" type="number" value="2026" style="width:80px"></div>
        <div class="check"><input id="rAll" type="checkbox" checked><label for="rAll" style="margin:0">all seasons</label></div>
        <div class="check"><input id="rForce" type="checkbox"><label for="rForce" style="margin:0">force</label></div>
      </div>
      <div class="btnrow">
        <button id="refreshTeam" class="mini">Refresh team page</button>
        <button id="refreshRoster" class="mini">Refresh whole roster</button>
      </div>
      <table>
        <thead><tr><th>Player</th><th class="num">Facts</th><th>Active</th><th></th></tr></thead>
        <tbody id="rosterBody"></tbody>
      </table>
      <div id="log"></div>
    </section>
  </div>
</main>

<main class="view" id="viewRange">
  <div class="panel" style="border-right:none">
    <h2>Range preview</h2>
    <div class="controls">
      <div><label>From</label><input id="rgStart" type="number" value="1" min="1"></div>
      <div><label>To</label><input id="rgEnd" type="number" value="20" min="1"></div>
      <div><label>Scope</label>
        <select id="rgScope">
          <option value="all">all</option>
          <option value="roster">roster</option>
          <option value="team">team</option>
        </select>
      </div>
      <div><label>Limit / number</label><input id="rgLimit" type="number" min="1" placeholder="config"></div>
      <div class="check"><input id="rgAll" type="checkbox"><label for="rgAll" style="margin:0">show all</label></div>
      <div class="check"><input id="rgHideEmpty" type="checkbox" checked><label for="rgHideEmpty" style="margin:0">hide empty numbers</label></div>
    </div>
    <div style="max-width:520px">
      <div class="playersHead">
        <label style="margin:0">Players (subset — none = everyone in scope)</label>
        <button id="rgPlayersNone" class="mini">clear</button>
      </div>
      <div class="players" id="rgPlayers"></div>
    </div>
    <div id="rgSummary" style="margin-top:12px" class="meta">—</div>
    <div id="rgResults"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let config = {};
const FIRST_DAY_DEFAULT = "2026-11-02";

function updateBanner() {
  const banner = $("#countdownBanner");
  const dateStr = config.first_day_game || FIRST_DAY_DEFAULT;
  const target = new Date(dateStr + "T00:00:00");
  if (isNaN(target)) { banner.hidden = true; return; }
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((target - today) / 86400000);
  const formatted = target.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
  if (days > 0) {
    banner.innerHTML = `<strong>${days}</strong> day${days === 1 ? "" : "s"} until first game — ${formatted}`;
  } else if (days === 0) {
    banner.innerHTML = `<strong>Game day!</strong> — ${formatted}`;
  } else {
    banner.hidden = true;
    return;
  }
  banner.hidden = false;
}

// which scalar config paths get a dedicated number input; everything else -> raw JSON
const FIELDS = [
  ["ranking_weights.active_roster_bonus", "active roster +"],
  ["ranking_weights.career_total_bonus", "career total +"],
  ["ranking_weights.single_game_bonus", "single game +"],
  ["ranking_weights.has_opponent_context_bonus", "opponent ctx +"],
  ["ranking_weights.pct_below_min_sample_penalty", "low-sample %"],
  ["ranking_weights.low_number_cutoff", "low-number cutoff"],
  ["ranking_weights.low_number_bonus", "low number +"],
  ["ranking_weights.high_number_bonus", "high number +"],
  ["scoring.pct_match_tolerance", "% match tol."],
  ["streak_min_length", "min streak len"],
  ["splits.min_games", "split min games"],
  ["max_suggestions_per_number", "default limit"],
];

const getPath = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
function setPath(obj, path, val) {
  const keys = path.split("."); const last = keys.pop();
  let o = obj;
  for (const k of keys) { o[k] = o[k] ?? {}; o = o[k]; }
  o[last] = val;
}

function renderFields() {
  $("#fields").innerHTML = "";
  for (const [path, label] of FIELDS) {
    const v = getPath(config, path);
    if (v === undefined) continue;
    const id = "f_" + path.replace(/\W/g, "_");
    const l = document.createElement("label"); l.textContent = label; l.htmlFor = id;
    const i = document.createElement("input");
    i.type = "number"; i.id = id; i.value = v; i.step = "any";
    i.addEventListener("input", () => {
      const n = i.value === "" ? null : Number(i.value);
      setPath(config, path, n);
      syncRaw(); schedulePreview();
    });
    $("#fields").append(l, i);
  }
  $("#firstDayGame").value = config.first_day_game || FIRST_DAY_DEFAULT;
  updateBanner();
}
const syncRaw = () => { $("#raw").value = JSON.stringify(config, null, 2); };

$("#firstDayGame").addEventListener("input", () => {
  config.first_day_game = $("#firstDayGame").value || FIRST_DAY_DEFAULT;
  syncRaw(); updateBanner();
});

$("#raw").addEventListener("input", () => {
  try {
    config = JSON.parse($("#raw").value);
    $("#cfgErr").textContent = "";
    renderFields(); schedulePreview();
  } catch (e) { $("#cfgErr").textContent = "invalid JSON — not applied"; }
});

// ---- preview ----
let timer;
const schedulePreview = () => { clearTimeout(timer); timer = setTimeout(runPreview, 250); };

async function runPreview() {
  const scope = $("#scope").value;
  const body = {
    number: Number($("#number").value || 0),
    scope,
    player: scope === "player" ? $("#player").value : null,
    limit: $("#limit").value ? Number($("#limit").value) : null,
    all: $("#all").checked,
    config,
  };
  let data;
  try {
    const r = await fetch("/api/suggest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await r.json();
  } catch (e) { $("#summary").textContent = "request failed"; return; }
  if (data.error) { $("#summary").textContent = data.error; $("#results").innerHTML = ""; return; }

  $("#summary").textContent = data.summary;
  const explain = $("#explain").checked;
  $("#results").innerHTML = data.results.map(r => `
    <div class="card ${r.score < 0 ? "neg" : ""}">
      <div class="draft">${escape(r.text)}</div>
      <div class="meta">
        <span class="score">score ${r.score.toFixed(1)}</span>
        ${r.kind === "rounded" ? '<span class="rounded-tag">rounded</span>' : ""}
        <span>${escape(r.stat_type)}</span>
        <span>${escape(r.source)}</span>
      </div>
      ${explain && Object.keys(r.reasons).length
        ? `<div class="weights">${escape(JSON.stringify(r.reasons))}</div>` : ""}
    </div>`).join("") || '<div class="meta">no matches</div>';
}
const escape = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

["number", "scope", "limit", "all", "explain"].forEach(id =>
  $("#" + id).addEventListener("input", () => {
    $("#playerWrap").hidden = $("#scope").value !== "player";
    schedulePreview();
  }));
$("#player").addEventListener("input", schedulePreview);

// ---- config load / save ----
async function loadConfig() {
  config = await (await fetch("/api/config")).json();
  if (!config.first_day_game) config.first_day_game = FIRST_DAY_DEFAULT;
  renderFields(); syncRaw();
}
$("#save").addEventListener("click", async () => {
  $("#cfgErr").textContent = "";
  const r = await fetch("/api/config", {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(config),
  });
  const d = await r.json();
  if (d.ok) { $("#savedMsg").innerHTML = '<span class="saved">saved</span>'; setTimeout(() => $("#savedMsg").innerHTML = "", 1500); }
  else $("#cfgErr").textContent = d.error || "save failed";
});
$("#reload").addEventListener("click", () => loadConfig().then(schedulePreview));

// ---- roster ----
async function loadRoster() {
  const d = await (await fetch("/api/roster")).json();
  const opts = d.players.map(p => `<option value="${p.slug}">${escape(p.name)}</option>`).join("");
  $("#player").innerHTML = opts || '<option value="">(none)</option>';
  $("#rosterBody").innerHTML = d.players.map(p => `
    <tr>
      <td>${escape(p.name)}<br><span class="meta">${p.slug}</span></td>
      <td class="num">${p.facts.toLocaleString()}</td>
      <td><span class="dot ${p.active ? "on" : ""}"></span></td>
      <td><button class="mini refreshOne" data-slug="${p.slug}">↻</button></td>
    </tr>`).join("");
  document.querySelectorAll(".refreshOne").forEach(b =>
    b.addEventListener("click", () => refresh({ mode: "player", slug: b.dataset.slug })));
  if (d.season) $("#rSeason").value = d.season;

  const checked = new Set(
    [...document.querySelectorAll("#rgPlayers input:checked")].map(i => i.value));
  $("#rgPlayers").innerHTML = d.players.map(p => `
    <label><input type="checkbox" value="${p.slug}" ${checked.has(p.slug) ? "checked" : ""}>
      ${escape(p.name)}</label>`).join("") || '<span class="meta">(no roster loaded)</span>';
  document.querySelectorAll("#rgPlayers input").forEach(i =>
    i.addEventListener("input", scheduleRangePreview));
}

let busy = false;
async function refresh(extra) {
  if (busy) return;
  busy = true;
  const buttons = document.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  const log = $("#log");
  log.style.display = "block";
  log.textContent += `\n$ refresh ${JSON.stringify(extra)} ...\n`;
  log.scrollTop = log.scrollHeight;
  const body = {
    season: Number($("#rSeason").value) || undefined,
    all_seasons: $("#rAll").checked,
    force: $("#rForce").checked,
    ...extra,
  };
  try {
    const d = await (await fetch("/api/refresh", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    })).json();
    log.textContent += (d.log || d.error || "(no output)") + "\n";
  } catch (e) {
    log.textContent += "request failed: " + e + "\n";
  }
  log.scrollTop = log.scrollHeight;
  busy = false;
  buttons.forEach(b => b.disabled = false);
  await loadRoster();
  runPreview();
  scheduleRangePreview();
}
$("#refreshTeam").addEventListener("click", () => refresh({ mode: "team" }));
$("#refreshRoster").addEventListener("click", () => refresh({ mode: "roster" }));

// ---- tabs ----
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === btn.dataset.view));
  if (btn.dataset.view === "viewRange") runRangePreview();
}));

// ---- range preview ----
let rgTimer;
const scheduleRangePreview = () => { clearTimeout(rgTimer); rgTimer = setTimeout(runRangePreview, 250); };

function statCard(r) {
  return `
    <div class="card ${r.score < 0 ? "neg" : ""}">
      <div class="draft">${escape(r.text)}</div>
      <div class="meta">
        <span class="score">score ${r.score.toFixed(1)}</span>
        ${r.kind === "rounded" ? '<span class="rounded-tag">rounded</span>' : ""}
        <span>${escape(r.player)}</span>
        <span>${escape(r.stat_type)}</span>
        <span>${escape(r.source)}</span>
      </div>
    </div>`;
}

async function runRangePreview() {
  const start = Number($("#rgStart").value || 0);
  const end = Number($("#rgEnd").value || 0);
  const players = [...document.querySelectorAll("#rgPlayers input:checked")].map(i => i.value);
  const body = {
    start, end,
    scope: $("#rgScope").value,
    players: players.length ? players : null,
    limit: $("#rgLimit").value ? Number($("#rgLimit").value) : null,
    all: $("#rgAll").checked,
    hide_empty: $("#rgHideEmpty").checked,
    config,
  };
  let data;
  try {
    const r = await fetch("/api/suggest_range", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    data = await r.json();
  } catch (e) { $("#rgSummary").textContent = "request failed"; return; }
  if (data.error) { $("#rgSummary").textContent = data.error; $("#rgResults").innerHTML = ""; return; }

  const matched = data.numbers.filter(n => n.total > 0).length;
  $("#rgSummary").textContent =
    `${start}–${end}: ${matched} of ${data.numbers.length || (end - start + 1)} number${end - start === 0 ? "" : "s"} shown have matches`;
  $("#rgResults").innerHTML = data.numbers.map(n => `
    <div class="numberBlock">
      <h3>${n.number} <span class="n-summary">${escape(n.summary)}</span></h3>
      ${n.results.map(statCard).join("") || '<div class="meta">no matches</div>'}
    </div>`).join("") || '<div class="meta">no numbers in range</div>';
}

["rgStart", "rgEnd", "rgScope", "rgLimit", "rgAll", "rgHideEmpty"].forEach(id =>
  $("#" + id).addEventListener("input", scheduleRangePreview));
$("#rgPlayersNone").addEventListener("click", () => {
  document.querySelectorAll("#rgPlayers input").forEach(i => i.checked = false);
  scheduleRangePreview();
});

// ---- boot ----
loadConfig().then(loadRoster).then(runPreview);
</script>
</body>
</html>
