services:
  pbp-db:
    image: postgres:16-alpine
    container_name: hoopskills-pbp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pbp
    ports:
      - "5544:5432"
    volumes:
      - pbp-db-data:/var/lib/postgresql/data

volumes:
  pbp-db-data:
